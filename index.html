<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDF0F5">
<title>Berry'm için</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--plum:#4B1D36;--berry:#C2185B;--paper:#FFFAF3}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{background:linear-gradient(180deg,#FDF0F5 0%,#FBE4EC 55%,#F7D8E4 100%);color:var(--plum);font-family:'Fraunces',Georgia,serif;overflow:hidden;-webkit-user-select:none;user-select:none}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.22;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .15 0 0 0 0 .25 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--berry);outline-offset:3px;border-radius:14px}
.hand{font-family:'Caveat',cursive}
.btn{background:var(--berry);color:#fff;border-radius:999px;padding:12px 24px;font-size:1rem;box-shadow:0 6px 18px rgba(194,24,91,.28);transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.ghost{background:#fff;color:var(--berry);box-shadow:0 4px 14px rgba(75,29,54,.12)}
.btn:disabled{opacity:.6}
.link{font-size:.9rem;text-decoration:underline;text-underline-offset:3px;opacity:.7;padding:8px}

/* Açılış */
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;transition:opacity .9s;z-index:30;background:inherit}
#intro.gone{opacity:0;pointer-events:none}
#intro .hi{font-size:2.1rem;color:var(--berry);font-weight:700}
#intro h1{font-size:2.3rem;font-weight:600;line-height:1.1;margin-bottom:18px}
.bud{width:140px;height:240px;overflow:visible;margin-bottom:6px;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.bud path{transform-box:fill-box}
.pl,.pr,.pc0,.kalp{transition:transform 1.2s cubic-bezier(.25,1.4,.45,1),opacity .6s}
.pl{transform-origin:100% 100%}.pr{transform-origin:0 100%}.pc0{transform-origin:50% 100%}
.kalp{transform-origin:50% 50%;transform:scale(.5)}
.opening .pl{transform:rotate(-46deg)}
.opening .pr{transform:rotate(46deg)}
.opening .pc0{transform:scaleY(.2);opacity:0}
.opening .kalp{transform:scale(1.6)}

/* Üst yazı alanı */
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center}
.top{flex:none;width:100%;max-width:520px;min-height:calc(196px + env(safe-area-inset-top));padding:calc(16px + env(safe-area-inset-top)) 22px 0;text-align:center}
.bar{height:4px;max-width:200px;margin:0 auto 12px;border-radius:4px;background:rgba(75,29,54,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--berry);transition:width .8s cubic-bezier(.3,1,.4,1)}
.txt{transition:opacity .25s,transform .35s cubic-bezier(.3,1.3,.5,1)}
.top.fade .txt{opacity:0;transform:translateY(6px)}
.kick{font-family:'Caveat',cursive;font-size:1.7rem;font-weight:700;color:var(--berry);line-height:1}
.top h2{font-size:1.5rem;font-weight:600;line-height:1.15;margin:5px 0;text-wrap:balance}
.hint{font-size:.95rem;opacity:.75;min-height:1.3em}
.acts{margin-top:12px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
.sw{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.45),transparent 45%),var(--c);box-shadow:0 0 0 3px #fff,0 4px 12px rgba(75,29,54,.2);transition:transform .2s}
.sw:active{transform:scale(.9)}
#finalActs{flex-direction:column;gap:6px}
#finalActs .row{display:flex;gap:10px;justify-content:center}
#finalActs .btn{padding:11px 18px;font-size:.95rem}

/* Bahçe */
.field{position:relative;flex:1;width:100%;max-width:520px;overflow:hidden}
.field::after{content:'';position:absolute;inset:0;background:#5E4A70;opacity:0;transition:opacity 1s;pointer-events:none;z-index:5}
.field.cloudy::after{opacity:.18}
.deco{position:absolute;width:120px;opacity:.75;z-index:0;pointer-events:none;animation:deco 70s linear infinite}
.deco.d2{width:90px;top:22%;animation-duration:95s;animation-delay:-40s;opacity:.55}
.ground{position:absolute;left:0;bottom:0;width:100%;height:18%;z-index:2;pointer-events:none}
.sun{position:absolute;right:7%;top:3%;width:76px;height:76px;z-index:6;pointer-events:none}
.sun svg{width:100%;height:100%;overflow:visible}
.rays{transform-box:fill-box;transform-origin:50% 50%;animation:spin 40s linear infinite}
.sun.shine{animation:shine 1.4s ease-out}
.cloud{position:absolute;right:0;top:1%;width:150px;z-index:7;touch-action:none;transform:translateX(var(--cx,0px));transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.cloud svg{width:100%;display:block;filter:drop-shadow(0 6px 10px rgba(75,29,54,.15))}
.cloud.drag{transition:none}
.cloud.enter{animation:cloudIn 1.1s cubic-bezier(.2,1,.4,1)}
.cloud.off{transition:transform 1.1s ease-in}

.flower{position:absolute;left:var(--x);bottom:8%;width:5px;margin-left:-2.5px;height:calc(var(--h) * var(--g,0));z-index:1;visibility:hidden;transform-origin:50% 100%;transition:height 1.1s cubic-bezier(.25,1.15,.45,1)}
.flower.on{visibility:visible}
.flower.live{animation:sway 5s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -1.1s)}
.flower::after{content:'';position:absolute;left:50%;top:-50px;bottom:0;width:70px;margin-left:-35px}
.stem{position:absolute;inset:0;background:linear-gradient(90deg,#74B65A,#4B8A3C);border-radius:3px}
.lf{position:absolute;width:26px;height:12px;top:44%;left:3px;background:linear-gradient(135deg,#8CCB70,#4B8A3C);border-radius:0 100% 0 100%;transform-origin:0 50%;transform:rotate(-28deg) scale(0);transition:transform .8s cubic-bezier(.3,1.5,.5,1) .25s}
.lf.l2{left:auto;right:3px;top:66%;border-radius:100% 0 100% 0;transform-origin:100% 50%;transform:rotate(28deg) scale(0)}
.tall .lf{transform:rotate(-28deg) scale(1)}
.tall .lf.l2{transform:rotate(28deg) scale(1)}
.head{position:absolute;left:50%;top:0;width:76px;height:76px;transform:translate(-50%,-60%)}
.head svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.head .bd{transform:scale(.42) translateY(30%);transform-origin:50% 100%;transition:transform .7s cubic-bezier(.3,1.3,.5,1),opacity .5s}
.big .head .bd{transform:scale(.64) translateY(16%)}
.bloom .head .bd{opacity:0;transform:scale(.8) translateY(10%)}
.flower .pt{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0) rotate(-25deg);transition:transform .8s cubic-bezier(.2,1.35,.4,1);transition-delay:calc(var(--d) * 38ms)}
.flower .pc{transform-box:fill-box;transform-origin:50% 50%;opacity:0;transform:scale(.3);transition:opacity .5s .5s,transform .7s .5s cubic-bezier(.3,1.6,.5,1)}
.flower.bloom .pt,.flower.bloom .pc{transform:none;opacity:1}
.flower.pick .head{animation:pulse 1.4s ease-in-out infinite}
.flower .fl{filter:drop-shadow(0 3px 4px rgba(75,29,54,.16))}

.mound{position:absolute;left:calc(var(--x) - 36px);bottom:5%;width:72px;height:34px;z-index:3}
.mound svg{width:100%;height:100%;display:block}
.mound::before{content:'';position:absolute;inset:-12px -6px;border-radius:50%;box-shadow:0 0 0 3px #fff;animation:ring 1.5s ease-out infinite}
.seed{position:absolute;width:10px;height:14px;margin-left:-5px;background:radial-gradient(circle at 35% 30%,#B98458,#6E4628);border-radius:50%;z-index:4;animation:seedFall .75s cubic-bezier(.5,0,.8,.6) forwards}
.can{position:absolute;left:calc(var(--x) - 10px);top:15%;width:90px;z-index:6;touch-action:none;transform-origin:85% 85%;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.can svg{width:100%;display:block;filter:drop-shadow(0 6px 8px rgba(75,29,54,.18))}
.can.pour{transform:rotate(-32deg)}
.drop{position:absolute;width:5px;height:9px;background:linear-gradient(#A9D2F2,#5C97CF);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;z-index:5;pointer-events:none;animation:dropFall .6s cubic-bezier(.5,0,1,.6) forwards}
.glow{animation:pulse 1.4s ease-in-out infinite}

.bug{position:absolute;z-index:8;padding:6px;touch-action:none}
.bug svg{display:block;overflow:visible;filter:drop-shadow(0 3px 3px rgba(75,29,54,.15))}
.b1{left:6%;top:8%;animation:drift1 19s ease-in-out infinite}
.b2{left:70%;top:32%;animation:drift2 23s ease-in-out infinite}
.b1 svg,.b2 svg{width:38px;height:38px}
.bee{left:40%;top:8%}
.bee svg{width:38px;height:34px;animation:bob 2.2s ease-in-out infinite;transition:width .3s,height .3s}
.bee.beckon svg{width:54px;height:48px;filter:drop-shadow(0 0 8px #fff)}
.bee.fly{transition:left .9s cubic-bezier(.45,0,.4,1),top .9s cubic-bezier(.45,0,.4,1)}
.lady{left:30%;bottom:5%;z-index:3;animation:crawl 14s ease-in-out infinite alternate}.lady svg{width:28px;height:28px}
.wl,.wr{transform-box:fill-box;animation:flap .32s ease-in-out infinite alternate}
.wl{transform-origin:100% 50%}.wr{transform-origin:0 50%}
.cat{position:absolute;right:3%;bottom:1%;width:30%;max-width:130px;z-index:3}
.cat svg{width:100%;display:block;overflow:visible;filter:drop-shadow(0 4px 5px rgba(75,29,54,.15))}
.cat.purr{animation:purr .5s ease}
.cat.beckon svg{filter:drop-shadow(0 0 10px #fff)}
.tail{transform-box:fill-box;transform-origin:0 100%;animation:tail 2.4s ease-in-out infinite alternate}
.eyes ellipse{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.5s infinite}
.toplama .bug,.toplama .cat,.toplama .dog{pointer-events:none}
.dog{position:absolute;left:2%;bottom:1%;width:27%;max-width:118px;z-index:3;transform:translateX(-170%);transition:transform 1.7s cubic-bezier(.3,1.05,.5,1)}
.dog.geldi{transform:none}
.dog.geldi svg{animation:hop .42s ease-in-out 4}
.dog svg{width:100%;display:block;overflow:visible;filter:drop-shadow(0 4px 5px rgba(75,29,54,.15))}
.dog.purr{animation:purr .5s ease}
.dtail{transform-box:fill-box;transform-origin:100% 100%;animation:wag .32s ease-in-out infinite alternate}
@keyframes hop{50%{transform:translateY(-7px)}}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}

/* Buket */
.buket{position:absolute;left:50%;bottom:3%;height:min(62%,430px);aspect-ratio:400/540;translate:-50% 0;z-index:4;transition:transform 1s cubic-bezier(.3,1.2,.5,1),opacity .7s;transform-origin:50% 100%}
.buket.hide{opacity:0;pointer-events:none}
.buket.hero{transform:translateY(-6%) scale(1.15)}
#buketSvg{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 92%}
.bm,.bx{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
.bm.in,.bx.in{transform:none}
.bs{opacity:0;transition:opacity .5s}
.bs.in{opacity:1}
.rib{transform-box:fill-box;transform-origin:50% 40%;transform:scale(0);transition:transform .9s cubic-bezier(.3,1.7,.5,1)}
.tied .rib{transform:none}
.tag{position:absolute;left:2%;bottom:16%;z-index:3;background:var(--paper);font-family:'Caveat',cursive;font-size:1.3rem;font-weight:700;padding:2px 12px;border-radius:4px;box-shadow:0 3px 8px rgba(75,29,54,.18);transform:rotate(-8deg) scale(0);transition:transform .7s cubic-bezier(.3,1.7,.5,1) .4s}
.tied .tag{transform:rotate(-8deg) scale(1)}
.final .buket #buketSvg{animation:sway 6s ease-in-out infinite alternate}

/* Fal ve zarf */
.fal{position:absolute;left:50%;top:40%;width:250px;height:250px;margin:-125px 0 0 -125px;z-index:4;animation:popIn2 .7s cubic-bezier(.3,1.5,.5,1)}
.fal svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 10px rgba(75,29,54,.15))}
.fal .p{cursor:pointer;transform-box:fill-box;transform-origin:50% 100%;transition:transform .8s cubic-bezier(.4,0,.6,1),opacity .8s}
.fal .p.off{transform:translateY(-80px) rotate(50deg);opacity:0;pointer-events:none}
.falWord{position:absolute;left:0;right:0;top:calc(40% + 140px);text-align:center;font-family:'Caveat',cursive;font-size:2.6rem;font-weight:700;color:var(--berry);z-index:4;text-shadow:0 2px 0 #FDF0F5,0 -2px 0 #FDF0F5,2px 0 0 #FDF0F5,-2px 0 0 #FDF0F5}
.falWord.pop{animation:wpop .35s cubic-bezier(.3,1.6,.5,1)}
.zarf{position:absolute;left:50%;top:40%;width:250px;margin:-90px 0 0 -125px;z-index:4;animation:popIn2 .7s cubic-bezier(.3,1.5,.5,1)}
.zarf svg{width:100%;display:block;overflow:visible;filter:drop-shadow(0 10px 14px rgba(75,29,54,.2))}
.zarf svg *{transform-box:fill-box}
.zarf:not(.open) svg{animation:bob 2.4s ease-in-out infinite}
.flap{transform-origin:50% 0;transition:transform .7s ease-in-out}
.zarf.open .flap{transform:scaleY(-1)}
.lp{transition:transform .9s cubic-bezier(.3,1.2,.5,1)}
.zarf.out .lp{transform:translateY(-80px)}
.seal{transform-origin:50% 50%;transition:transform .35s ease-in}
.zarf.open .seal{transform:scale(0) rotate(90deg)}

/* Kart, mektup, balon, efektler */
.bubble{position:fixed;z-index:40;max-width:230px;background:#fff;padding:10px 14px;border-radius:16px;font-size:1.35rem;line-height:1.15;box-shadow:0 8px 24px rgba(75,29,54,.18);transform:translate(-50%,-100%) scale(.9);pointer-events:none;opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.3,1.5,.5,1)}
.bubble.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(75,29,54,.28);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .3s}
.card{background:var(--paper);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:22px 24px calc(24px + env(safe-area-inset-bottom));animation:up .55s cubic-bezier(.25,1.2,.45,1)}
.card .mini{width:70px;height:70px;margin:-58px auto 6px;filter:drop-shadow(0 4px 6px rgba(75,29,54,.2))}
.card .mini svg{width:100%;height:100%;overflow:visible}
.ay{text-align:center;font-weight:600;color:var(--berry);font-size:1.05rem}
.not{font-size:1.7rem;line-height:1.22;text-align:center;margin:10px auto 20px;max-width:32ch}
.card .btn{display:block;margin:0 auto}
.letter{position:fixed;inset:0;z-index:22;background:rgba(75,29,54,.35);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;animation:fadeIn .4s}
.paper{margin:auto 0;background:var(--paper);width:100%;max-width:430px;min-height:430px;border-radius:6px;padding:30px 26px 26px;box-shadow:0 22px 50px rgba(75,29,54,.28);transform:rotate(-1.2deg);animation:unfold .7s cubic-bezier(.25,1.2,.45,1);font-family:'Caveat',cursive;font-size:1.5rem;line-height:1.28}
.paper p{margin-bottom:12px}
.paper .to{font-size:2.1rem;font-weight:700;color:var(--berry)}
.paper .sign{text-align:right;font-weight:700;margin:8px 0 18px}
.lbtns{display:flex;gap:10px;justify-content:center;font-family:'Fraunces',serif}
.lbtns .btn{padding:11px 18px;font-size:.95rem}
.petal{position:fixed;top:-24px;z-index:21;width:13px;height:17px;background:linear-gradient(135deg,#FCD0DE,#EE8BAE);border-radius:70% 0 70% 0;pointer-events:none;animation:fall linear forwards}
.petal.w{background:linear-gradient(135deg,#fff,#F1DDE6)}
.bst{position:fixed;z-index:35;pointer-events:none;border-radius:50%;animation:burst .9s cubic-bezier(.2,.8,.3,1) forwards}
.bst svg{width:100%;height:100%;display:block}

@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes flap{to{transform:scaleX(.3)}}
@keyframes tail{from{transform:rotate(-10deg)}to{transform:rotate(8deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes purr{30%{transform:scale(1.06,.94)}60%{transform:scale(.97,1.03)}}
@keyframes drift1{25%{transform:translate(110px,40px)}50%{transform:translate(200px,-5px)}75%{transform:translate(80px,70px)}}
@keyframes drift2{30%{transform:translate(-120px,-30px)}60%{transform:translate(-200px,40px)}80%{transform:translate(-60px,-50px)}}
@keyframes crawl{to{transform:translateX(70px)}}
@keyframes deco{from{transform:translateX(-140px)}to{transform:translateX(560px)}}
@keyframes pulse{50%{filter:drop-shadow(0 0 9px #fff) drop-shadow(0 0 3px #fff)}}
@keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(1.35);opacity:0}}
@keyframes seedFall{from{transform:translateY(-140px) rotate(-90deg)}to{transform:none}}
@keyframes dropFall{to{transform:translate(var(--dx),var(--fall)) scaleY(1.3);opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{40%{transform:scale(1.35);filter:drop-shadow(0 0 22px #FFD36E)}}
@keyframes cloudIn{from{transform:translateX(220px)}}
@keyframes popIn2{from{transform:scale(.6);opacity:0}}
@keyframes wpop{from{transform:scale(.7)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes unfold{from{transform:rotate(-1.2deg) translateY(40px) scale(.92);opacity:0}}
@keyframes fall{to{transform:translate3d(var(--dx),112vh,0) rotateX(540deg) rotateY(320deg) rotateZ(160deg)}}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs id="defs">
  <linearGradient id="gPap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAD5DF"/></linearGradient>

  <linearGradient id="gLale2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9708F"/><stop offset="1" stop-color="#A11C43"/></linearGradient>
  <linearGradient id="gGul" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7809E"/><stop offset="1" stop-color="#B01C46"/></linearGradient>
  <radialGradient id="gGulIc" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#8A1336"/><stop offset="1" stop-color="#D2385F"/></radialGradient>
  <linearGradient id="gAy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE066"/><stop offset="1" stop-color="#EE9A17"/></linearGradient>
  <radialGradient id="gAyC" cx=".45" cy=".4" r=".65"><stop offset="0" stop-color="#7A4A21"/><stop offset=".6" stop-color="#4E2C14"/><stop offset="1" stop-color="#2E180A"/></radialGradient>
  <linearGradient id="gKoz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDDCE8"/><stop offset="1" stop-color="#E5679A"/></linearGradient>
  <linearGradient id="gYaprak" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8CCB70"/><stop offset="1" stop-color="#4B8A3C"/></linearGradient>
  <linearGradient id="gOka" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C2D6BC"/><stop offset="1" stop-color="#7E9F7A"/></linearGradient>
  <linearGradient id="gKraft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0D6B3"/><stop offset="1" stop-color="#C69766"/></linearGradient>
  <linearGradient id="gKraft2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2BE91"/><stop offset="1" stop-color="#B07F55"/></linearGradient>
  <linearGradient id="gKraftD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8AF82"/><stop offset="1" stop-color="#A3754A"/></linearGradient>

];
const MEKTUP = [
  "Bunu yazarken bile yüzümde kocaman bir gülümseme var. Beş ay oldu ve ben sana hâlâ ilk günkü gibi bakıyorum, hatta daha fazla.",

const field = $('#field');
let step = -1;

const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;

// ---------- Çiçek çizimleri ----------
const halka = (n, r0, f) => { let s = ''; for (let i = 0; i < n; i++) s += f(r0 + i * 360 / n, i); return s; };
const noktalar = (n, rad, r, fill, op = 1) => halka(n, 0, a => { const t = a * Math.PI / 180; return `<circle cx="${(Math.cos(t) * rad).toFixed(1)}" cy="${(Math.sin(t) * rad).toFixed(1)}" r="${r}" fill="${fill}" opacity="${op}"/>`; });

    + `<g class="pc"><circle r="8" fill="url(#gSari)"/>${noktalar(8, 4.8, .9, '#B87310', .55)}<circle r="1.8" fill="#B87310" opacity=".45"/></g>`;
  if (t === 'lale') return y('M-3 10C-19 6 -21 -14 -12 -27C-8 -16 -3 -9 -3 10Z', 'url(#gLale2)', 0) + y('M3 10C19 6 21 -14 12 -27C8 -16 3 -9 3 10Z', 'url(#gLale2)', 0)

    + '<path class="pc" d="M-4 -18C-7 -8 -7 1 -5 7" stroke="#fff" stroke-opacity=".45" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
  if (t === 'gul') return halka(5, 0, r => y('M0 0C-15 -3 -18 -22 0 -26C18 -22 15 -3 0 0Z', 'url(#gGul)', r, kenar))
    + halka(5, 36, r => y('M0 0C-11 -2 -13 -16 0 -19C13 -16 11 -2 0 0Z', '#E2557B', r, kenar))
    + '<g class="pc"><circle r="9.5" fill="url(#gGulIc)"/><path d="M-6 1C-6 -6 6 -7 6 0C6 5 -1 6 -2 1C-2 -2 2 -2 2 0" stroke="#6E0E2A" stroke-width="1.4" fill="none" stroke-linecap="round"/></g>';

    + halka(18, 10, r => y('M0 -9C-3.6 -12 -4 -20 0 -24C4 -20 3.6 -12 0 -9Z', '#EFA01C', r))
    + `<g class="pc"><circle r="12.5" fill="url(#gAyC)"/>${noktalar(14, 9, 1, '#1E0F05', .5)}${noktalar(9, 5.6, 1, '#1E0F05', .45)}${noktalar(5, 2.6, .9, '#1E0F05', .4)}</g>`;

  if (toplanan === 5) setTimeout(() => {
    field.classList.remove('toplama');
    document.querySelectorAll('.bxs').forEach(g => g.classList.add('in'));
    document.querySelectorAll('.bx').forEach((g, n) => setTimeout(() => g.classList.add('in'), n * 110));
    yaz('Biraz daha ekledim', 'Kalabalık olsun, sana yakışır.', '');
    setTimeout(() => { yaz('Az kaldı', 'Kurdele rengini sen seç.', ''); $('#swatches').hidden = false; }, 2000);
  }, 950);
}
$('#buket').addEventListener('click', () => {
  if (step !== 5) return;
  const i = F.findIndex(f => !f.dataset.picked);
  if (i > -1) topla(i);
});
document.querySelectorAll('.sw').forEach(s => s.onclick = () => {
  kurdeleBoya(s.dataset.c);
  $('#buket').classList.add('tied');
  $('#swatches').hidden = true;
  setTimeout(() => { serp(document.querySelector('.rib'), 18); salla(); }, 350);
  yaz('İşte buketin', 'Beş ayın hepsi bu bukette.', 'Sanal ama kokusu gerçek, söz.');
  setTimeout(() => dugme('Devam', () => go(6)), 1000);
});
function buketAdim() {
  yaz('Beş ay, beş çiçek', 'Şimdi hepsini senin için toplayalım.', 'Çiçeklere tek tek dokun.');
  $('#buket').classList.remove('hide');
  F.forEach(f => { f.classList.remove('live'); f.classList.add('pick'); });
  field.classList.add('toplama');
}
// ---------- Papatya falı ----------
let kopan = 0;
const YAPRAK = 11;
function falAdim() {
  $('#buket').classList.add('hide');
  yaz('Bir de fal bakalım', 'Seviyor mu, sevmiyor mu?', 'Yaprakları tek tek kopar.');
  let s = '<path d="M0 30C-4 70 4 100 0 140" stroke="#5A9646" stroke-width="5" fill="none" stroke-linecap="round"/>';
  for (let i = 0; i < YAPRAK; i++) s += `<g transform="rotate(${(i * 360 / YAPRAK).toFixed(1)})"><path class="p" d="M0 -22C-14 -32 -17 -72 0 -88C17 -72 14 -32 0 -22Z" fill="url(#gPap)" stroke="#DCC7D1" stroke-width="1.2"/></g>`;
  s += `<circle r="27" fill="url(#gSari)"/>${noktalar(16, 18, 2, '#B87310', .45)}${noktalar(9, 10, 1.8, '#B87310', .4)}`;
  $('#falSvg').innerHTML = s;
  $('#fal').hidden = false;
  $('#falSvg').querySelectorAll('.p').forEach(p => p.addEventListener('click', () => {
    if (p.classList.contains('off')) return;
    p.classList.add('off');
    kopan++;
    const w = $('#falWord');
    w.hidden = false;
    w.classList.remove('pop'); void w.offsetWidth; w.classList.add('pop');
    if (kopan === YAPRAK) {
      w.textContent = 'Seviyor!';
      serp(w, 10, true); serp(w, 16);
      yaz('Papatya konuştu', 'Seviyor. Hem de çok.', 'Zaten biliyordun.');
      setTimeout(() => dugme('Devam', () => go(7)), 1000);
    } else {
      w.textContent = kopan % 2 ? 'Seviyor...' : 'Sevmiyor...';
      if (kopan === 2) balon(cat, 'Hıh. İnanmadım, devam et.');
    }
  }));
}
// ---------- Mektup ----------
let atla = false, pdfSoz = null;
function zarfAdim() {
  $('#fal').hidden = true; $('#falWord').hidden = true;
  yaz('Son olarak', 'Sana bir mektubum var.', 'Mührü kır.');
  const z = $('#zarf');
  z.hidden = false;
  z.onclick = async () => {
    z.onclick = null;
    z.classList.add('open');
    await wait(700);
    z.querySelector('svg').insertBefore(z.querySelector('.flap'), z.querySelector('.lp'));
    z.classList.add('out');
    await wait(1100);
    mektupAc();
  };
}
async function mektupAc() {
  $('#letter').hidden = false;
  const box = $('#ltext');
  box.innerHTML = '';
  atla = false;
  for (const par of MEKTUP) {
    const p = document.createElement('p');
    box.appendChild(p);
    for (const ch of par) {
      if (atla) { p.textContent = par; break; }
      p.textContent += ch;
      $('#letter').scrollTop = $('#letter').scrollHeight;
      await wait(ch === ' ' ? 12 : 21);
    }
    if (!atla) await wait(250);
  }
  $('#lsign').hidden = false;
  $('#lbtns').hidden = false;
  $('#ldevam').focus();
  pdfSoz = pdfSoz || mektupPdf().catch(() => null);
}
$('#letter').addEventListener('click', e => { if (!e.target.closest('.lbtns')) atla = true; });
$('#ldevam').onclick = () => { $('#letter').hidden = true; go(8); };

// ---------- İndirme ve paylaşma ----------
const tarih = () => new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
function tane(x, w, h, a = .05) { for (let i = 0; i < w * h / 220; i++) { x.fillStyle = `rgba(75,29,54,${(Math.random() * a).toFixed(3)})`; x.fillRect(Math.random() * w, Math.random() * h, 1.6, 1.6); } }
function satirSay(x, metin, maxW) {
  let n = 0, satir = '';
  for (const kelime of metin.split(' ')) { const t = satir ? satir + ' ' + kelime : kelime; if (x.measureText(t).width > maxW && satir) { n++; satir = kelime; } else satir = t; }
  return n + (satir ? 1 : 0);
}
function sar(x, metin, px, py, maxW, lh) {
  let satir = '';
  for (const kelime of metin.split(' ')) {
    const t = satir ? satir + ' ' + kelime : kelime;
    if (x.measureText(t).width > maxW && satir) { x.fillText(satir, px, py); py += lh; satir = kelime; } else satir = t;
  }
  if (satir) { x.fillText(satir, px, py); py += lh; }
  return py;
}
async function buketResmi(w) {
  const xs = new XMLSerializer();
  let str = xs.serializeToString($('#buketSvg'));
  const defs = xs.serializeToString($('#defs'));
  str = str.replace(/^<svg([^>]*)>/, (m, a) => `<svg${a} width="${w}" height="${Math.round(w * 540 / 400)}">${defs}`);
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
  await img.decode();
  return img;
}
async function fontlar() { await Promise.all(['700 80px Caveat', '500 50px Caveat', '600 50px Fraunces', '400 30px Fraunces'].map(f => document.fonts.load(f))); }
async function hikayeResmi() {
  await fontlar();
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 1920);
  g.addColorStop(0, '#FDF0F5'); g.addColorStop(.6, '#FBE2EB'); g.addColorStop(1, '#F6D2E0');
  x.fillStyle = g; x.fillRect(0, 0, 1080, 1920);
  tane(x, 1080, 1920, .045);
  for (let i = 0; i < 34; i++) {
    x.save(); x.translate(Math.random() * 1080, Math.random() * 1920); x.rotate(Math.random() * 6.3);
    x.fillStyle = i % 3 ? 'rgba(240,141,176,.55)' : 'rgba(255,255,255,.85)';
    x.beginPath(); x.ellipse(0, 0, 11, 18, 0, 0, Math.PI * 2); x.fill(); x.restore();
  }
  x.textAlign = 'center';
  x.fillStyle = '#C2185B'; x.font = "700 132px Caveat"; x.fillText("Berry'm için", 540, 300);
  x.fillStyle = '#4B1D36'; x.font = "600 56px Fraunces"; x.fillText('5 ay, 5 çiçek', 540, 380);
  const img = await buketResmi(820);
  x.drawImage(img, 130, 440, 820, 1107);
  x.font = "700 76px Caveat"; x.fillText(HIKAYE_SOZU, 540, 1640);
  x.globalAlpha = .65; x.font = "400 36px Fraunces"; x.fillText(tarih(), 540, 1712); x.globalAlpha = 1;
  return new Promise(r => c.toBlob(r, 'image/png'));
}
function jsPdfYukle() {
  if (window.jspdf) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function mektupPdf() {
  await Promise.all([jsPdfYukle(), fontlar()]);
  const W = 1240, H = 1754, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#FFFAF3'; x.fillRect(0, 0, W, H);
  tane(x, W, H, .035);
  x.strokeStyle = '#EFC0CF'; x.lineWidth = 3; x.strokeRect(60, 60, W - 120, H - 120);
  x.lineWidth = 1.2; x.strokeRect(78, 78, W - 156, H - 156);
  const img = await buketResmi(240);
  x.drawImage(img, (W - 240) / 2, 100, 240, 324);
  let fs = 54;
  const yukseklik = f => { x.font = `500 ${f}px Caveat`; return MEKTUP.reduce((t, p) => t + satirSay(x, p, W - 300) * Math.round(f * 1.22) + 18, 0); };
  while (fs > 30 && 600 + yukseklik(fs) + 110 > H - 150) fs -= 2;
  let y = 500;
  x.textAlign = 'left'; x.fillStyle = '#C2185B'; x.font = "700 88px Caveat"; x.fillText("Berry'm,", 150, y); y += 100;
  x.fillStyle = '#4B1D36'; x.font = `500 ${fs}px Caveat`;
  for (const p of MEKTUP) y = sar(x, p, 150, y, W - 300, Math.round(fs * 1.22)) + 18;
  x.font = "700 62px Caveat"; x.textAlign = 'right'; x.fillText('Hep senin', W - 150, y + 24);
  x.textAlign = 'center'; x.globalAlpha = .6; x.font = "400 28px Fraunces"; x.fillText(tarih() + ', 5. ayımız', W / 2, H - 118); x.globalAlpha = 1;
  const pdf = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
  pdf.addImage(c.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, 595.28, 841.89);
  return pdf.output('blob');
}
async function paylas(blob, ad) {
  const file = new File([blob], ad, { type: blob.type });
  if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = ad;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
async function indir(btn, soz, ad) {
  const eski = btn.textContent;
  btn.disabled = true; btn.textContent = 'Hazırlanıyor...';
  try {
    const blob = await soz();
    if (!blob) throw new Error('yok');
    await paylas(blob, ad);
  } catch (e) {
    balon(btn, 'Olmadı. İnternet bağlantısını kontrol edip tekrar dene.');
  }
  btn.disabled = false; btn.textContent = eski;
}
let hikayeSoz = null;
const pdfAl = () => (pdfSoz = pdfSoz || mektupPdf().catch(() => null)).then(b => b || (pdfSoz = null, mektupPdf()));
$('#pdfBtn').onclick = e => indir(e.currentTarget, pdfAl, 'berry-mektup.pdf');
$('#pdfBtn2').onclick = e => indir(e.currentTarget, pdfAl, 'berry-mektup.pdf');
$('#storyBtn').onclick = e => indir(e.currentTarget, () => (hikayeSoz = hikayeSoz || hikayeResmi()), 'berry-buket.png');
$('#bastan').onclick = () => location.reload();

// ---------- Final ----------
function final() {
  $('#zarf').hidden = true; $('#fal').hidden = true; $('#falWord').hidden = true;
  $('#app').classList.add('final');
  $('#buket').classList.remove('hide');
  $('#buket').classList.add('hero');
  yaz('Mutlu 5. aylar', "Seni çok seviyorum, Berry'm.", 'Sevgi her şeyi çözer.');
  yapraklar();
  setTimeout(() => { $('#finalActs').hidden = false; }, 2200);
  setTimeout(() => { hikayeSoz = hikayeSoz || hikayeResmi().catch(() => (hikayeSoz = null)); }, 1500);
}

const ADIMLAR = [ay1, ay2, ay3, ay4, ay5, buketAdim, falAdim, zarfAdim, final];
function go(n) {
  step = n;
  $('#bar').style.width = (n / (ADIMLAR.length - 1) * 100) + '%';
  ADIMLAR[n]();
}
document.querySelectorAll('.bug[data-msg]').forEach(el => el.onclick = () => balon(el, el.dataset.msg));
$('#ac').onclick = () => {
  $('#intro').classList.add('opening');
  $('#ac').disabled = true;
  setTimeout(() => {
    $('#app').hidden = false;
    $('#intro').classList.add('gone');
    go(0);
    setTimeout(() => { $('#intro').hidden = true; }, 950);
  }, 1500);
};
</script>
